name: store-gateway
services:
  gateway:
    build: .
    ports:
    - 127.0.0.1:${HTTP_PORT:-8080}:8080
    environment:
      AUTH_URL: ${AUTH_URL:-http://auth:8080}
      ACCOUNT_URL: ${ACCOUNT_URL:-http://account:8080}
      ORDER_URL: ${ORDER_URL:-http://order:8080}
      PRODUCT_URL: ${PRODUCT_URL:-http://product:8080}
      EXCHANGE_URL: ${EXCHANGE_URL:-http://exchange:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*}
    networks:
    - services
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/gateway/health-check]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
networks:
  # Shared with the other store services (docker network create store-dev).
  services:
    name: store-dev
    external: true
