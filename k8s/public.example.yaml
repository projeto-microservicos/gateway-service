# Optional and NOT applied by the pipeline: exposes the gateway to the internet through
# an AWS Network Load Balancer (~US$ 16/month while it exists). Apply once, by hand:
#   kubectl -n store apply -f k8s/public.example.yaml
#   kubectl -n store get service gateway-public   # EXTERNAL-IP = public DNS name
# Remove with: kubectl -n store delete -f k8s/public.example.yaml
apiVersion: v1
kind: Service
metadata:
  name: gateway-public
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
  - name: http
    port: 80
    targetPort: 8080
