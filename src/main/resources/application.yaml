server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
                allowed-headers: '*'
                allowed-methods: '*'
                allow-credentials: true
          # Single public entry point. Every service behind it is ClusterIP-only.
          routes:
          - id: auth
            uri: ${AUTH_URL:http://auth:8080}
            predicates:
            - Path=/auth/**
          - id: account
            uri: ${ACCOUNT_URL:http://account:8080}
            predicates:
            - Path=/accounts/**
          - id: order
            uri: ${ORDER_URL:http://order:8080}
            predicates:
            - Path=/orders/**
          - id: product
            uri: ${PRODUCT_URL:http://product:8080}
            predicates:
            - Path=/products/**
          - id: exchange
            uri: ${EXCHANGE_URL:http://exchange:8080}
            predicates:
            # exchange.md declares /exchanges/{from}/{to} but its example (and the BACEN page) use /exchange/...
            - Path=/exchanges/**,/exchange/**

store:
  gateway:
    auth-solve-url: ${AUTH_URL:http://auth:8080}/auth/solve
    cookie-name: __store_jwt_token
    # "METHOD /path" or "METHOD /prefix/**"; METHOD may be ANY.
    open-routes:
    - POST /auth/register
    - POST /auth/login
    - POST /auth/logout
    # The access token may already be expired here; the refresh token is checked by auth-service.
    - POST /auth/refresh
    - GET /gateway/health-check
    # Service-to-service endpoints that must never be reachable from outside (404).
    internal-routes:
    - ANY /auth/solve
    - ANY /accounts/**
    - ANY /accounts

management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
